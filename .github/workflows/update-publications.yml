name: Update publications from arXiv

on:
  schedule:
    - cron: "17 06 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install publication tools
        run: python -m pip install -r requirements-publications.txt
      - name: Enrich the checked-in bibliography from arXiv
        run: python scripts/update_publications.py
      - name: Commit changes when publications changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bibliography/bibliography.bib _data/publications.json
          git diff --cached --quiet || git commit -m "chore: update publications from arXiv"
          git push
